name: Deploy software website

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh public release metadata without asking each visitor to call GitHub's API.
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Refresh official releases
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build static website
        run: npm run build
      - name: Validate links and release data
        run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
